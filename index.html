<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Amigaso · Selección y Seguimiento T.A.T.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2A5C;--gold:#BF9B30;--bg:#fff;--soft:#EEF2F8;--ink:#1F2937;--line:#D5DDEA;--sky:#5BA4E0;--ok:#4CAF50;--coral:#F4A582;--yel:#F5C518;--red:#D32F2F;--serif:Cambria,Lora,Georgia,'Times New Roman',serif;--sans:Calibri,Carlito,Lato,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;padding-bottom:64px}
h1,h2,h3,h4{font-family:var(--serif);color:var(--navy);font-weight:700;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}h4{font-size:1.02rem}
p{margin:.4em 0 .8em}
.gold{color:var(--gold)}.navy{color:var(--navy)}.muted{color:#5b6678;font-size:.92rem}.small{font-size:.88rem}
.brandbar{display:flex;justify-content:flex-end;align-items:center;padding:14px 28px;gap:12px;flex-wrap:wrap}
.brand{font-size:1rem;color:var(--navy)}
.logo{font-family:var(--serif);font-style:italic;font-weight:700;color:var(--navy);font-size:1.7rem;border-bottom:3px solid var(--gold);padding:0 2px 2px;line-height:1.1;display:inline-block}
.logo .d{color:var(--gold)}
.logoimg{height:62px;width:auto;display:block}
.navbar{background:var(--navy);display:flex;justify-content:space-between;align-items:stretch;flex-wrap:wrap;padding:0 20px;gap:6px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:#fff;font:700 .95rem var(--sans);padding:14px 16px;cursor:pointer;border-bottom:4px solid transparent;letter-spacing:.03em;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.08)}
.tab.on{border-bottom-color:var(--gold);color:var(--gold)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
#saveStatus{color:#c9d4ea;font-size:.78rem;margin-right:4px}
.main{max-width:1240px;margin:0 auto;padding:26px 24px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;text-align:center;padding:10px 14px;font-size:.84rem;z-index:40;line-height:1.3}
.foot b{color:var(--gold);font-weight:700}
.card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card.white{background:#fff}
.card.gold-l{border-left:6px solid var(--gold)}
.card h3,.card h4{margin-top:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.f{flex:1;min-width:170px}
label.l{display:block;font-weight:700;font-size:.85rem;color:var(--navy);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{width:100%;font:inherit;color:var(--ink);padding:9px 11px;border:1px solid #b9c5d9;border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
textarea{resize:vertical}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:.97rem}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--navy);flex:none}
.btn{font:700 .95rem var(--sans);border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:9px 18px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.15)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.nav{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;padding:6px 12px;font-size:.85rem}
.btn.nav.gold{background:var(--gold);border-color:var(--gold)}
.btn.sm{padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 11px;font-weight:700;white-space:nowrap}
td{padding:8px 11px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--soft)}
td input,td select{padding:6px 8px;min-width:80px}
td input[type=number]{min-width:84px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-weight:700;font-size:.8rem;white-space:nowrap}
.sem-rojo{background:var(--red);color:#fff}.sem-amarillo{background:var(--yel);color:#3a2f00}.sem-verde{background:var(--ok);color:#fff}.sem-na{background:#d5dbe6;color:#4b5565}
.pill.navyp{background:var(--navy);color:#fff}.pill.goldp{background:var(--gold);color:#fff}.pill.soft{background:#fff;border:1px solid var(--line);color:var(--navy)}
.ej{background:var(--coral);color:#5a2410;font-size:.7rem;padding:2px 8px;border-radius:99px;font-weight:700;margin-left:6px}
.alert{border-radius:12px;padding:12px 16px;margin:0 0 14px;border:2px solid;font-weight:600}
.alert.red{background:#FDECEC;border-color:var(--red);color:#8a1c1c}
.alert.gold{background:#FBF4DD;border-color:var(--gold);color:#5a470a}
.alert.blue{background:#E6EEF9;border-color:var(--navy);color:var(--navy)}
.alert.green{background:#E9F5EA;border-color:var(--ok);color:#245c27}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--gold)}
.kpi .n{font:700 1.7rem var(--serif);color:var(--navy)}
.kpi .t{font-size:.82rem;color:#5b6678;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.steps{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.stp{flex:1;min-width:130px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:700;color:var(--navy);font-size:.88rem;text-align:left;font-family:var(--sans)}
.stp.on{border-color:var(--gold);background:#FBF4DD}.stp.done{background:var(--navy);color:#fff;border-color:var(--navy)}.stp.lock{opacity:.5;cursor:not-allowed}
.stp small{display:block;font-weight:400;opacity:.85}
.bar{height:10px;background:#dfe6f2;border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:.3s}
.numc{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font:700 1rem var(--serif);align-items:center;justify-content:center;flex:none}
.notas{display:flex;gap:8px;flex-wrap:wrap}
.nb{width:48px;height:44px;border-radius:10px;border:2px solid var(--navy);background:#fff;color:var(--navy);font:700 1.1rem var(--sans);cursor:pointer}
.nb:hover{background:var(--soft)}.nb.on{background:var(--navy);color:#fff}
.rub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.rub div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.86rem}
.rub b{color:var(--navy);display:block}
.quote{border-left:4px solid var(--gold);padding:4px 12px;margin:8px 0;background:#fff;border-radius:0 8px 8px 0}
.split{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 100px);overflow:auto}
.semaf{display:flex;gap:10px;align-items:center}
.lights{display:flex;flex-direction:column;gap:6px;background:var(--navy);padding:10px;border-radius:40px}
.lights i{display:block;width:34px;height:34px;border-radius:50%;background:#2a3d6b}
.lights i.on.r{background:var(--red);box-shadow:0 0 14px var(--red)}.lights i.on.y{background:var(--yel);box-shadow:0 0 14px var(--yel)}.lights i.on.g{background:var(--ok);box-shadow:0 0 14px var(--ok)}
.big{font:700 2.4rem var(--serif);color:var(--navy);line-height:1}
.hb{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:.85rem}
.hb .lab{width:150px;flex:none;color:var(--navy);font-weight:700}
.hb .tr{flex:1;background:#e4eaf4;border-radius:6px;height:16px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px}
.hb .v{width:96px;flex:none;text-align:right}
details.acc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.acc summary{cursor:pointer;padding:13px 16px;font:700 1.05rem var(--serif);color:var(--navy);list-style:none;display:flex;gap:10px;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:'+';color:var(--gold);font:700 1.3rem var(--sans);width:18px}
details.acc[open] summary::before{content:'–'}
details.acc .bd{padding:2px 18px 14px}
.overlay{position:fixed;inset:0;background:#fff;z-index:100;overflow:auto;display:none}
.overlay.show{display:block}
.overlay .in{max-width:900px;margin:0 auto;padding:24px 22px 110px}
.modal{position:fixed;inset:0;background:rgba(15,42,92,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%;border-top:6px solid var(--gold)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;z-index:300;max-width:92vw;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}.toast.ok{background:#2e7d32}
.login{max-width:430px;margin:40px auto;padding:0 18px}
.login .card{background:#fff;border-top:6px solid var(--gold);padding:26px}
.hl{border-left:6px solid var(--gold)!important;background:#FBF4DD!important}
.timer{font:700 2.6rem var(--serif);color:var(--navy)}
.hide{display:none}
.hint{font-size:.82rem;color:#5b6678}
@media(max-width:900px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.side{position:static;max-height:none}.rub{grid-template-columns:1fr}}
@media(max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.main{padding:16px 12px}.brandbar{padding:10px 14px}.logo{font-size:1.4rem}h1{font-size:1.6rem}.hb .lab{width:100px}.foot{font-size:.72rem}}
</style>
</head>
<body>
<div id="app"></div>
<div id="manual" class="overlay"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
'use strict';
/* El usuario y la contraseña ya NO viven en este archivo: se validan en el servidor (api/login.js).
   Se definen en Vercel con las variables APP_USER y APP_PASSWORD, o se cambian desde Configuración → Acceso. */
const MAX_CAND = 10, IDEAL_MIN = 5, IDEAL_MAX = 8;

const COMPETENCIAS_DEF = [
 {id:'prosp',nombre:'Prospección y apertura de clientes nuevos',peso:20,
  pregunta:'Cuénteme cómo consiguió un cliente nuevo sin que nadie se lo recomendara.',
  repreguntas:'¿Cómo identificó el negocio? ¿Qué le dijo en el primer contacto? ¿Cuántos intentos hizo y qué resultado obtuvo?',
  r1:'Depende de referidos o de clientes que ya llegan; contacta sin criterio o no concreta resultados.',
  r3:'Identifica negocios nuevos en su zona, los contacta y acuerda un primer pedido o una visita de seguimiento.',
  r5:'Busca clientes nuevos de forma sistemática, prioriza por potencial, adapta el abordaje y verifica pedido y recompra.',
  accion:'Practicar con el entrenador la apertura en frío: identificar negocios nuevos cada semana, preparar el primer mensaje y registrar el resultado de cada intento.'},
 {id:'rel',nombre:'Relación y fidelización de clientes',peso:15,
  pregunta:'Cuénteme sobre un cliente con el que construyó una relación de años. ¿Qué hizo para que le siguiera comprando?',
  repreguntas:'¿Qué sabía de su negocio (qué rota, quién decide, horarios)? ¿Cómo mantenía el contacto? ¿Qué pasó cuando surgió un problema?',
  r1:'Trata al cliente como una transacción; no conoce su negocio ni mantiene contacto fuera de la venta.',
  r3:'Conoce lo básico del negocio y mantiene un contacto regular y cordial.',
  r5:'Anticipa necesidades, ajusta oferta y visitas a la realidad del negocio, resuelve problemas con rapidez y logra recompra o recomendaciones.',
  accion:'Elaborar una ficha básica por cliente (qué rota, quién decide, horarios) y fijar un contacto regular de seguimiento posventa.'},
 {id:'seg',nombre:'Seguimiento y constancia',peso:20,
  pregunta:'Cuénteme cómo recuperó una venta o un cliente después de que le dijeron «no» o dejó de comprar.',
  repreguntas:'¿Cuánto esperó para volver y por qué? ¿Qué registró y qué fecha fijó? ¿Cómo midió el resultado?',
  r1:'Depende de la memoria y no fija fechas; se rinde o insiste en exceso ante el primer «no».',
  r3:'Registra el pendiente, fija una fecha de regreso y retoma sin presionar.',
  r5:'Usa sus registros para priorizar y retomar a tiempo, cambia el enfoque en cada regreso y mide la recuperación o la recompra.',
  accion:'Registrar cada pendiente con fecha de regreso y revisar cada semana con el mentor las ventas por recuperar.'},
 {id:'ruta',nombre:'Planeación de ruta e imprevistos',peso:15,
  pregunta:'Describa una semana en que tuvo más clientes por visitar que tiempo disponible, o en que un imprevisto cambió su ruta.',
  repreguntas:'¿Qué priorizó y por qué? ¿Cómo ajustó la ruta y cómo cuidó su seguridad? ¿Qué logró?',
  r1:'Visita sin prioridad; los imprevistos desordenan su día y no tiene plan alterno.',
  r3:'Prioriza por oportunidad y cercanía, arma una agenda viable y ajusta cuando surge un imprevisto.',
  r5:'Equilibra potencial, compromisos, desplazamiento y seguridad de la zona; tiene plan alterno, mide cobertura y ajusta.',
  accion:'Planear la ruta de la semana priorizando por potencial y compromisos, con un plan alterno y criterios de seguridad de la zona.'},
 {id:'promo',nombre:'Promociones y cierre',peso:10,
  pregunta:'Relate una venta en la que un cliente objetó el precio o pidió una alternativa distinta a la que usted tenía, y cómo la cerró.',
  repreguntas:'¿Qué necesidad identificó? ¿Qué promoción o alternativa ofreció y por qué? ¿Cómo cerró?',
  r1:'Concede descuentos sin explorar la necesidad u ofrece la promoción al azar.',
  r3:'Diagnostica la objeción, elige la promoción o alternativa que encaja con el negocio y propone un cierre.',
  r5:'Ajusta la promoción al tipo de negocio, cuantifica el valor para el cliente, ofrece alternativas dentro de las condiciones y confirma un compromiso verificable.',
  accion:'Ensayar con el entrenador el manejo de objeciones de precio: diagnosticar la necesidad antes de ofrecer la promoción o alternativa autorizada.'},
 {id:'apr',nombre:'Aprendizaje comercial',peso:10,
  pregunta:'Describa una ocasión en que cambió su forma de vender después de recibir retroalimentación.',
  repreguntas:'¿Qué cambió usted? ¿Cómo probó si funcionó?',
  r1:'No identifica cambio concreto ni resultado.',
  r3:'Aplica una acción específica y describe su efecto.',
  r5:'Prueba el cambio, compara resultados y comparte el aprendizaje.',
  accion:'Acordar con el mentor un cambio concreto por semana y medir su efecto en la visita siguiente.'},
 {id:'auto',nombre:'Autonomía y autogestión',peso:5,
  pregunta:'Cuénteme cómo organizó y manejó su trabajo en un periodo en que casi no tuvo supervisión.',
  repreguntas:'¿Qué metas se fijó? ¿Cómo supo si iba bien? ¿Qué hizo cuando se desvió?',
  r1:'Necesita que le digan qué hacer y cuándo; no se fija metas ni revisa su avance.',
  r3:'Se organiza sola, cumple lo acordado y avisa a su jefe cuando se desvía.',
  r5:'Se fija metas propias, revisa sus resultados con regularidad, corrige antes de que se lo pidan y comparte sus avances con su jefe.',
  accion:'Fijar metas semanales propias y revisarlas cada semana con el jefe directo.'},
 {id:'integ',nombre:'Integridad comercial',peso:5,
  pregunta:'Cuénteme qué hizo ante una solicitud de prometer algo que no podía garantizar.',
  repreguntas:'¿Qué verificó? ¿Qué informó al cliente y a quién escaló?',
  r1:'Promete sin autorización, oculta información o evita registrar el caso.',
  r3:'Explica límites, verifica y comunica una alternativa autorizada.',
  r5:'Documenta el caso, escala oportunamente y confirma el acuerdo con el cliente.',
  accion:'Repasar las políticas comerciales (condiciones autorizadas, escalamiento y registro de casos) antes de salir a ruta.'}
];
const CRITERIOS = [
 {id:'prio',nombre:'Priorización',peso:25,tarea:'Selecciona dos tiendas y ordena la visita; identifica cuál hará por teléfono.',
  r1:'Prioriza sin explicar potencial o ignora compromisos.',r3:'Justifica la selección por oportunidad y compromisos.',r5:'Integra potencial, urgencia y tiempos; define alternativa para la tercera.',
  accion:'Ejercitar la priorización de visitas con casos prácticos, considerando potencial, urgencia, tiempos y una alternativa para la tienda no visitada.'},
 {id:'diag',nombre:'Diagnóstico y propuesta',peso:25,tarea:'Formula al menos dos preguntas de diagnóstico y presenta un pedido coherente.',
  r1:'Ofrece el producto sin indagar o hace un cálculo incorrecto.',r3:'Indaga necesidad y calcula correctamente un pedido viable.',r5:'Valida rotación y capacidad de compra, calcula el pedido y explica por qué encaja.',
  accion:'Practicar preguntas de diagnóstico (rotación y capacidad de compra) y el cálculo del pedido dentro del presupuesto del cliente.'},
 {id:'obj',nombre:'Objeción y cierre',peso:25,tarea:'Responde a la objeción, respeta las condiciones y busca un compromiso verificable.',
  r1:'Concede condiciones sin aval o deja el cierre abierto.',r3:'Explica las condiciones y acuerda pedido o próximo contacto con fecha.',r5:'Aborda la causa de la objeción y logra un compromiso específico respetando las condiciones.',
  accion:'Ensayar respuestas a objeciones respetando las condiciones autorizadas y cerrando con un compromiso específico.'},
 {id:'reg',nombre:'Registro y seguimiento',peso:25,tarea:'Escribe el registro de la visita con cliente, resultado, siguiente acción y fecha.',
  r1:'Registro incompleto o sin próximo paso.',r3:'Registra datos esenciales, acción y fecha.',r5:'Añade cantidades, objeción, compromiso, responsable y criterio de seguimiento.',
  accion:'Practicar el registro completo de la visita: cliente, resultado, cantidades, objeción, compromiso, siguiente acción, responsable y fecha.'}
];
const CASOS_DEF = [
 {id:'casoA',nombre:'Caso 1 · Gestión y priorización de ruta comercial TAT',
  contexto:`Usted es asesor comercial de una empresa distribuidora y tiene bajo su responsabilidad la atención de tiendas de barrio mediante el modelo de venta tienda a tienda (TAT). Su labor consiste en gestionar los clientes actuales, identificar nuevas oportunidades de negocio y garantizar una adecuada administración de su ruta comercial.
Para esta jornada cuenta con 90 minutos disponibles y tres oportunidades comerciales en su zona. Sin embargo, por las restricciones de tiempo y desplazamiento, únicamente podrá realizar dos visitas presenciales. Deberá analizar la situación de cada establecimiento, priorizar sus visitas y definir cómo gestionará la oportunidad restante.`,
  situaciones:`## Tienda La Esquina
- Es un cliente activo que realizó su última compra hace tres semanas.
- Actualmente solicita una visita para realizar una nueva compra, pues necesita reponer su inventario.
- Manifiesta interés en recibir el producto durante la jornada de hoy.
## Tienda Central
- Es un cliente potencial que todavía no ha realizado compras con la empresa.
- Representa una oportunidad comercial de alto potencial por las características de su negocio.
- El encargado únicamente puede atenderlo al inicio de la ruta, por lo que existe una ventana de tiempo limitada para concretar el acercamiento.
## Tienda El Parque
- Es un cliente activo que realizó una compra recientemente.
- Actualmente cuenta con inventario disponible.
- Solicita que el asesor confirme telefónicamente cierta información antes de considerar una nueva compra.`,
  condiciones:`La oferta disponible para el ejercicio es:
- Presentación: caja de 12 unidades.
- Precio por caja: $72.000 COP.
- Precio por unidad: $6.000 COP.
- Pedido mínimo: una caja.
- Forma de pago: contado.
- No están autorizados descuentos ni ventas a crédito.
## Restricciones de la ruta
- Tiempo total disponible: 90 minutos.
- Cada visita presencial, incluyendo desplazamiento y atención, toma aproximadamente 45 minutos.
- La llamada telefónica al tercer cliente puede realizarse al finalizar la ruta.`,
  venta:`Durante la simulación, el entrevistador asumirá el papel de un tendero y presentará la siguiente objeción:
> «Mi proveedor actual me vende a crédito, me da 30 días para pagar y además me ofrece un 10% de descuento. Si ustedes me mejoran esas condiciones, podría comprarles dos cajas».
Si el candidato realiza preguntas para conocer mejor la situación del negocio, responder:
- Rotación actual: vende aproximadamente 6 unidades por semana.
- Presupuesto disponible para compra hoy: máximo $100.000 COP.`,
  actividades:`1. **Planeación y priorización:** seleccione las dos tiendas que visitaría presencialmente, establezca el orden de la ruta y justifique su decisión. Explique cómo gestionaría la tercera oportunidad.

  // cambios que aún no se habían enviado (por ejemplo, si la sesión venció): se conservan

  const loaded = Object.assign(blankState(), r.data);

    S = Object.assign(blankState(), local); delete (S.cfg || {}).cred;

    touch('cfg', 'main');

  } else {
    S = loaded; S.cfg = normCfg(S.cfg);
    pend.forEach(([col, id, doc]) => {
      if (col === 'cfg') { if (doc) S.cfg = doc; } else if (doc === undefined) delete (S[col] || {})[id]; else (S[col] = S[col] || {})[id] = doc;

async function flush() {
  clearTimeout(ST.timer);

  if (!ST.online || !ST.dirty.size) { if (!ST.online) setStatus('error'); return; }
  ST.writing = true;
  const items = [...ST.dirty.values()]; ST.dirty.clear();
  const failed = []; let expired = false;
  for (let i = 0; i < items.length; i += 20) {
    const chunk = items.slice(i, i + 20);
    const ops = chunk.map(([col, id]) => { const doc = col === 'cfg' ? S.cfg : S[col][id]; return { col, id, doc: doc === undefined ? null : JSON.parse(JSON.stringify(doc)) }; });
    try {
      const r = await api('/api/data', { method: 'POST', body: JSON.stringify({ ops }) });

      if (!r.ok) failed.push(...chunk);
    } catch (e) { failed.push(...chunk); }
  }
  ST.writing = false;
  failed.forEach(it => ST.dirty.set(it[0] + '/' + it[1], it));   // lo que falló se vuelve a intentar
  if (expired) { ST.retries = 0; setStatus('error'); sessionExpired(); return; }
  if (failed.length) { ST.retries++; setStatus('error'); ST.timer = setTimeout(flush, Math.min(30000, 3000 * ST.retries)); return; }
  ST.retries = 0;

}

function ta(path, o = {}) { return `<textarea rows="${o.rows || 2}" placeholder="${esc(o.ph || '')}" ${attrs(path, o)}>${esc(getPath(path) ?? '')}</textarea>`; }

function usel(path, v, options, o = {}) { return `<select data-ui="${path}" ${o.rr ? 'data-rr="1"' : ''}>${options.map(([val, lab]) => `<option value="${esc(val)}" ${String(v ?? '') === String(val) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`; }
const semPill = (s, txt) => s ? `<span class="pill sem-${s.k}">${txt || s.t}</span>` : `<span class="pill sem-na">${txt || 'Pendiente'}</span>`;

function loginView() {
  return `<div class="brandbar">${LOGO}</div>
  <div class="login"><div class="card">
   <h1 style="text-align:center;margin-bottom:4px">Bienvenido</h1>
   <p class="muted" style="text-align:center">Plataforma de Selección y Seguimiento Comercial T.A.T.</p>
   ${!UI.ready ? '<div class="alert blue">Cargando tus datos guardados…</div>' : ''}
   ${UI.expired ? '<div class="alert gold">Su sesión venció. Ingrese de nuevo: los cambios pendientes se conservaron y se enviarán al entrar.</div>' : ''}
   <form id="loginForm" autocomplete="off">
    <label class="l" for="lu">Usuario</label><input type="text" id="lu" autocomplete="off">
    <label class="l" for="lp" style="margin-top:12px">Contraseña</label><input type="password" id="lp" autocomplete="off">
    <div id="loginErr" class="alert red hide" style="margin-top:12px">Usuario o contraseña incorrectos</div>
    <button class="btn gold" style="width:100%;margin-top:16px" ${UI.ready ? '' : 'disabled'}>Ingresar</button>
   </form></div></div>${footer()}`;
}
function shell() {
  const tabs = [['dash', 'Dashboard'], ['eval', 'Evaluación'], ['seg', 'Seguimiento'], ['cfg', 'Configuración']];
  let body = '';
  if (UI.tab === 'dash') body = dashView(); else if (UI.tab === 'eval') body = evalView(); else if (UI.tab === 'seg') body = segView(); else body = cfgView();
  return `<div class="brandbar">${LOGO}</div>
  <nav class="navbar"><div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${UI.tab === k ? 'on' : ''}" data-act="tab" data-a="${k}">${l}</button>`).join('')}</div>
   <div class="acts"><span id="saveStatus"></span>
    <button class="btn nav" data-act="manual">Manual</button>
    <button class="btn nav gold" data-act="excelAll">Descargar todo en Excel</button>
    <button class="btn nav" data-act="logout">Cerrar sesión</button></div></nav>
  <main class="main">${body}</main>${footer()}`;
}
function render() {
  const y = window.scrollY;
  $('#app').innerHTML = SESSION.ok ? shell() : loginView();
  setStatus(ST.status);
  window.scrollTo(0, y);
  if (typeof Timer !== 'undefined') Timer.paint();
}
function toast(msg, kind) {
  const r = $('#toastRoot'); r.innerHTML = `<div class="toast ${kind || ''}">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 3800);
}
function confirmar(msg, ok = 'Sí, continuar') {
  return new Promise(res => {
    const r = $('#modalRoot');
    r.innerHTML = `<div class="modal"><div class="box"><h3>Confirmar</h3><p>${esc(msg)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn danger" id="mSi">${esc(ok)}</button></div></div></div>`;
    $('#mNo').onclick = () => { r.innerHTML = ''; res(false); };
    $('#mSi').onclick = () => { r.innerHTML = ''; res(true); };
  });
}

/* ====== manual ====== */
function manualHTML(first) {
  const cfg = S.cfg, cz = cfg.cortes, pe = cfg.pesos;
  const rowsExp = [...cfg.exp].sort((a, b) => a.gt - b.gt).map((r, i) => `<tr><td>${i === 0 ? 'Hasta ' + fmt(cfg.exp.slice().sort((a, b) => a.gt - b.gt)[1] ? cfg.exp.slice().sort((a, b) => a.gt - b.gt)[1].gt : 1, 0) + ' año (incluido el 0)' : 'Más de ' + r.gt + ' años'}</td><td>${esc(r.nivel)}</td><td>${r.pts > 0 ? '+' : ''}${r.pts} puntos</td></tr>`).join('');
  return `<div class="brandbar">${LOGO}</div>
  <div class="in"><h1>Manual de uso</h1>
  <p class="muted">Lea este manual una vez. Puede volver a abrirlo cuando quiera con el botón «Manual» de la barra superior.</p>
  <details class="acc" open><summary>A. ¿Para qué sirve?</summary><div class="bd"><p>Esta plataforma convierte el proceso de selección y seguimiento de asesores T.A.T. en un método escrito, igual para todos los candidatos y con registro de cada decisión (trazabilidad). Funciona igual sin importar quién la use.</p></div></details>
  <details class="acc"><summary>B. Recorrido en 5 pasos</summary><div class="bd"><ol><li><b>Psicotécnica EROS:</b> se registra el resultado de la prueba.</li><li><b>Experiencia en ventas:</b> años de experiencia, que suman puntos adicionales.</li><li><b>Entrevista por competencias:</b> 8 competencias, de 30 a 40 minutos.</li><li><b>Simulación comercial:</b> caso práctico de 20 a 30 minutos, según el criterio del entrevistador.</li><li><b>Resultado y semáforo:</b> puntaje, recomendación y acciones de mejora.</li></ol><p>Después, el <b>Seguimiento</b> de quienes se contratan y el <b>Dashboard</b> de los canales de reclutamiento.</p></div></details>
  <details class="acc"><summary>C. Cómo se calcula el puntaje</summary><div class="bd">
   <ul><li><b>Con prueba psicotécnica:</b> Entrevista estructurada ${pe.con.ent} % + Simulación comercial ${pe.con.sim} % + Prueba psicotécnica ${pe.con.eros} %.</li>
   <li><b>Sin prueba psicotécnica</b> (pendiente): Entrevista ${pe.sin.ent} % + Simulación ${pe.sin.sim} %.</li>
   <li>Ese resultado es el <b>puntaje base</b>. Su máximo es 100 %.</li>
   <li>La <b>experiencia en ventas</b> suma <b>puntos adicionales (bono)</b> al puntaje base. Por eso el puntaje total máximo es 120 %.</li>
   <li><b>Puntaje total = puntaje base + bono por experiencia.</b></li></ul>
   <div class="table-wrap"><table><thead><tr><th>Experiencia en ventas</th><th>Nivel</th><th>Bono</th></tr></thead><tbody>${rowsExp}</tbody></table></div>
   <div class="alert gold" style="margin-top:12px"><b>Ejemplo 1 (sin psicotécnica):</b> entrevista 80 %, simulación 70 %, más de 2 años de experiencia.<br>Base = 80 × 0,60 + 70 × 0,40 = <b>76</b>. Bono = <b>10</b>. Total = <b>86 %</b> → amarillo.</div>
   <div class="alert gold"><b>Ejemplo 2 (con psicotécnica):</b> entrevista 80 %, simulación 70 %, psicotécnica 90 %, más de 2 años de experiencia.<br>Base = 80 × 0,45 + 70 × 0,35 + 90 × 0,20 = <b>78,5</b>. Bono = <b>10</b>. Total = <b>88,5 %</b> → amarillo.</div></div></details>
  <details class="acc"><summary>D. Semáforo</summary><div class="bd"><ul>
   <li><span class="pill sem-rojo">ROJO</span> menos de ${cz.rojo} %: insuficiente. No recomendar contratación.</li>
   <li><span class="pill sem-amarillo">AMARILLO</span> de ${cz.rojo} % a ${cz.verde} %, ambos inclusive: satisfactorio. Recomendar contratación con acompañamiento del entrenador.</li>
   <li><span class="pill sem-verde">VERDE</span> más de ${cz.verde} %: excelente. Recomendar contratación inmediata y trasladar las mejoras al jefe directo.</li></ul>
   <p>La plataforma muestra siempre el <b>puntaje base</b> y el <b>total con experiencia</b>.</p></div></details>
  <details class="acc"><summary>E. Cómo calificar</summary><div class="bd"><p>Use notas <b>enteras de 1 a 5</b> (use 2 o 4 cuando la evidencia quede entre dos niveles). Registre hechos con el método <b>STAR</b>: Situación, Tarea, Acción, Resultado. Una nota de 3 sobre 5 equivale a 60 %.</p></div></details>
  <details class="acc"><summary>F. Regla de integridad</summary><div class="bd"><p>Si la nota de <b>Integridad comercial</b> es 1 o 2, RR. HH. debe revisar y documentar el caso antes de decidir, sin importar el puntaje.</p></div></details>
  <details class="acc"><summary>G. Regla de confidencialidad</summary><div class="bd"><p>No se capacita ni se comparte información confidencial (portafolio, rutas comerciales) con una persona que aún no ha pasado el proceso de selección. La simulación reemplaza las salidas a campo antes de contratar.</p></div></details>
  <details class="acc"><summary>H. Privacidad</summary><div class="bd"><p>Use solo el <b>código del candidato</b> (no cédula ni datos sensibles) y marque la autorización de tratamiento de datos (Ley 1581 de 2012).</p></div></details>
  <details class="acc"><summary>I. Seguimiento y Dashboard</summary><div class="bd"><p><b>Seguimiento:</b> en las primeras 4 semanas (hasta 13) se registran 8 indicadores por semana, agrupados en Resultado, Actividad y Calidad, frente a su meta, los hitos de control a 7, 30, 60 y 90 días y la autorización de ruta autónoma. Sirve para apoyar al asesor a tiempo.</p><p><b>Dashboard:</b> compara los canales de reclutamiento con dos indicadores: el <b>% de candidatos aptos</b> (calidad rápida) y el <b>costo por asesor retenido a 90 días</b> (decisión de pauta cada trimestre).</p></div></details>
  <details class="acc"><summary>J. Descarga y respaldo</summary><div class="bd"><p>Su información se guarda sola cada vez que cambia algo, y la verá de nuevo cuando vuelva a ingresar. Como respaldo, use <b>«Descargar todo en Excel»</b> en la barra superior. También puede descargar una sola convocatoria o un solo candidato desde la pestaña Evaluación.</p></div></details>
  <div style="text-align:center;margin-top:20px"><button class="btn gold" data-act="manualClose" style="font-size:1.05rem;padding:12px 28px">${first ? 'Entendido, comenzar' : 'Cerrar manual'}</button></div></div>${footer()}`;
}
function openManual(first) { const m = $('#manual'); m.innerHTML = manualHTML(first); m.classList.add('show'); m.scrollTop = 0; }
function closeManual() { $('#manual').classList.remove('show'); $('#manual').innerHTML = ''; }

/* ====== DASHBOARD ====== */
function inRange(mes) { const d = UI.dash; if (d.desde && (!mes || mes < d.desde)) return false; if (d.hasta && (!mes || mes > d.hasta)) return false; return true; }
function dashData() {
  const f = UI.dash;
  const regs = Object.entries(S.canalMes).map(([id, r]) => Object.assign({ id }, r)).filter(r => inRange(r.mes) && (!f.canal || r.canal === f.canal));
  const cands = Object.values(S.cands).filter(c => c.saved && calc(c).completo && inRange(mesOf(c)) && (!f.canal || c.fuente === f.canal));
  const ids = [...new Set([...S.cfg.canales.map(c => c.id), ...regs.map(r => r.canal), ...cands.map(c => c.fuente)])].filter(id => id && (!f.canal || id === f.canal));
  let rows = ids.map(id => {
    const rs = regs.filter(r => r.canal === id), cs = cands.filter(c => c.fuente === id);
    const sum = k => rs.reduce((a, r) => a + (num(r[k]) || 0), 0);
    const post = sum('postulantes'), aptos = sum('aptos'), contr = sum('contratados'), ret = sum('retenidos'), inv = sum('inversion');
    const diasV = rs.map(r => num(r.dias)).filter(x => x != null);
    const ks = cs.map(c => calc(c));
    const dist = { verde: 0, amarillo: 0, rojo: 0 }; ks.forEach(k => { if (!k.pendInteg) dist[k.sem.k]++; });
    const tot = ks.map(k => k.total);
    const per = cs.filter(c => (c.estado === 'Contratado' || c.estado === 'En seguimiento') && S.seg[c.id] && (S.seg[c.id].permanece === 'si' || S.seg[c.id].permanece === 'no'));
    const entrev = Object.values(S.cands).filter(x => x.fuente === id && calc(x).entDone && inRange(mesOf(x))).length;
    return { id, nombre: canalNombre(id), hasReg: rs.length > 0, entrev, post, aptos, contr, ret, inv, dias: diasV.length ? diasV.reduce((a, b) => a + b, 0) / diasV.length : null,
      eval: cs.length, prom: tot.length ? tot.reduce((a, b) => a + b, 0) / tot.length : null, dist,
      pctVerde: cs.length ? dist.verde / cs.length * 100 : null,
      kpi1: post > 0 ? aptos / post * 100 : null, kpi2: ret > 0 ? inv / ret : null, costoContr: contr > 0 ? inv / contr : null,
      perm: per.length ? per.filter(c => S.seg[c.id].permanece === 'si').length / per.length * 100 : null };
  }).filter(r => r.hasReg || r.eval > 0 || r.entrev > 0);
  const base = rows.filter(r => r.hasReg);

function rich(t) {

    const used = Object.values(S.convs).find(c => c.casoId === d.a);
    if (S.cfg.casos.length <= 1) { toast('Debe quedar al menos un caso.', 'err'); return; }
    if (used) { toast(`Este caso está asignado a la convocatoria «${used.nombre}». No se puede eliminar.`, 'err'); return; }
    if (!await confirmar('¿Eliminar este caso del banco?', 'Eliminar')) return;
    S.cfg.casos = S.cfg.casos.filter(x => x.id !== d.a); touch('cfg', 'main'); render();
  },
  canalAdd: () => { S.cfg.canales.push({ id: 'ch' + uid(), nombre: 'Nuevo canal', tipo: '', activo: true, nota: '' }); touch('cfg', 'main'); render(); },
  canalDel: async d => {
    const ch = S.cfg.canales[Number(d.a)];
    const used = Object.values(S.cands).some(c => c.fuente === ch.id) || Object.values(S.canalMes).some(r => r.canal === ch.id);
    if (!await confirmar(used ? 'Este canal tiene candidatos o registros asociados; quedarán como «canal eliminado». ¿Continuar?' : '¿Eliminar este canal?', 'Eliminar')) return;
    S.cfg.canales.splice(Number(d.a), 1); touch('cfg', 'main'); render();
  },
  saveCred: async () => {
    const u = ($('#cu').value || '').trim(), p1 = $('#cp1').value, p2 = $('#cp2').value;
    if (!u || !p1) { toast('Escriba el nuevo usuario y la nueva contraseña.', 'err'); return; }
    if (p1 !== p2) { toast('Las contraseñas no coinciden.', 'err'); return; }
    let r; try { r = await api('/api/cred', { method: 'POST', body: JSON.stringify({ u, p: p1 }) }); } catch (e) { r = null; }
    if (!r || !r.ok) { toast((r && r.data && r.data.error) || 'No se pudo actualizar el acceso. Intente de nuevo.', 'err'); return; }
    $('#cu').value = ''; $('#cp1').value = ''; $('#cp2').value = ''; toast('Acceso actualizado. Úselo la próxima vez que ingrese.', 'ok');
  },
  demoLoad: () => loadDemo(), demoDel: () => delDemo()
};
async function doLogin() {
  const u = ($('#lu').value || '').trim(), p = $('#lp').value, err = $('#loginErr'), btn = $('#loginForm button');
  const show = m => { if (err) { err.textContent = m; err.classList.remove('hide'); } if (btn) btn.disabled = false; };
  if (err) err.classList.add('hide');
  if (!u || !p) { show('Escriba su usuario y su contraseña.'); return; }
  if (btn) btn.disabled = true;
  let r;
  try { r = await api('/api/login', { method: 'POST', body: JSON.stringify({ u, p }) }); }
  catch (e) { show('No se pudo conectar con el servidor. Revise su conexión e intente de nuevo.'); return; }
  if (r.status === 401) { show('Usuario o contraseña incorrectos'); return; }
  if (!r.ok) { show((r.data && r.data.error) || 'El servidor no respondió correctamente. Intente más tarde.'); return; }
  const res = await loadData();
  if (res !== 'ok') { show('Ingresó, pero no se pudieron cargar los datos. Recargue la página e intente de nuevo.'); return; }
  SESSION.ok = true; UI.expired = false;
  UI.tab = 'dash'; UI.ev.convId = null; UI.ev.candId = null; UI.seg.candId = null; render(); openManual(true);
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault();
  try { await f(el.dataset, el); } catch (err) { console.warn(err); toast('Ocurrió un problema. Intente de nuevo.', 'err'); }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.path) onPath(el); else if (el.dataset && el.dataset.ui) onUi(el); });
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.live && LIVE[el.dataset.live]) LIVE[el.dataset.live](el); });
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'loginForm') doLogin(); });

window.addEventListener('beforeunload', e => { if (ST.dirty.size || ST.writing) { e.preventDefault(); e.returnValue = ''; } });
(async function boot() {
  S.cfg = defaultCfg(); render();
  const res = await loadData();            // si la sesión (cookie) sigue vigente, entra directo con los datos guardados
  if (res === 'ok') SESSION.ok = true;
  UI.ready = true;
  render();
})();
</script>
</body>
</html>
